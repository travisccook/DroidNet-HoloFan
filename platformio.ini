; DroidNet-HoloFan: PlatformIO runs only the off-hardware unit tests of the
; libraries in lib/. The firmware itself builds with ESP-IDF:
; firmware/holofan/build.sh (README "Building").
;   pio test -e native                    every suite
;   pio test -e native -f test_mcu_proto  one suite
[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
